name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `channel: stable`. A release must not change toolchain
          # from one day to the next, and the project is on Gradle 8.12 /
          # AGP 8.9.1, which newer stable Flutter rejects outright
          # ("Gradle version is lower than Flutter's minimum"). Bump this
          # together with android/gradle/wrapper and the AGP version in
          # android/settings.gradle.
          flutter-version: 3.35.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Cheap, and it fails the moment a vendored patch stops matching the
      # archive it claims to come from. Needs network, so it runs before the
      # analysis steps rather than being folded into them.
      - name: Verify vendored package patches
        run: tool/verify_vendor_patches.sh

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run tests
        run: flutter test --reporter=expanded
