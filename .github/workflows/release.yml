name: Release

# A tagged push is the only trigger that publishes an APK. Everything else is
# a build check, so a broken main never produces a downloadable release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with .github/workflows/ci.yml. See the note there:
          # the Gradle version in android/ constrains which Flutter can be used.
          flutter-version: 3.35.5
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Gradle only complains about this once it has resolved the whole
      # toolchain, which is a slow way to find out that the pinned versions do
      # not go together. Fail here instead.
      - name: Check the Flutter and Gradle versions line up
        run: |
          set -euo pipefail
          wrapper=$(sed -n 's|.*gradle-\([0-9.]*\)-.*|\1|p' \
            android/gradle/wrapper/gradle-wrapper.properties)
          flutter_version=$(flutter --version --machine \
            | sed -n 's/.*"frameworkVersion": *"\([^"]*\)".*/\1/p')
          echo "Flutter $flutter_version, Gradle $wrapper"
          if [ "$flutter_version" != "3.35.5" ]; then
            echo "::error file=android/gradle/wrapper/gradle-wrapper.properties::\
              This workflow is pinned to Flutter 3.35.5 but found \
              $flutter_version. Upgrade android/gradle/wrapper to \
              $([ "${flutter_version%%.*}" -ge 3 ] && echo 8.14 || echo 8.12) \
              and the AGP version in android/settings.gradle, then update the \
              flutter-version pin in .github/workflows/."
            exit 1
          fi

      - name: Build universal release APK
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols

      # Gradle 8.12 with the current AGP writes the APK under build/android,
      # and Flutter's own lookup has moved between the two layouts across
      # versions. Take it from wherever it landed rather than assuming.
      - name: Collect the APK
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find build -name 'app-release.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No app-release.apk was produced by the build"
            exit 1
          fi
          echo "Found $apk ($(du -h "$apk" | cut -f1))"
          # The updater in the app fetches an asset with this exact name.
          cp "$apk" dist/app-release.apk

      # A debug-signed build installs and runs, so nothing downstream complains
      # about it. But it cannot be replaced by a release-signed one later
      # without uninstalling first, and it is not distributable. Say which one
      # this is rather than letting it be discovered by a user.
      - name: Report how the APK is signed
        run: |
          set -euo pipefail
          apksigner=$(command -v apksigner || true)
          if [ -z "$apksigner" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            apksigner=$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner was not found, so the signing identity is unknown"
            exit 0
          fi

          if ! "$apksigner" verify --print-certs dist/app-release.apk > /tmp/certs 2>/tmp/certs.err; then
            echo "::error::The APK signature does not verify"
            cat /tmp/certs.err
            exit 1
          fi

          signer=$(sed -n 's/^Signer #1 certificate DN: //p' /tmp/certs)
          case "$signer" in
            *"CN=Android Debug"*)
              echo "::warning::This APK is signed with the DEBUG certificate, because no KEYSTORE_* secrets are configured. It installs and runs, but it cannot be upgraded in place by a release-signed build, and it is not suitable for distribution."
              ;;
            "")
              echo "::error::The APK verified but reported no signer"
              exit 1
              ;;
            *)
              echo "Signed with a release certificate: $signer"
              ;;
          esac

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/app-release.apk
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: ignore

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-release.apk
          generate_release_notes: true
          body: |
            ## SunmiPrint ${{ github.ref_name }}

            | Asset | Description |
            | --- | --- |
            | `app-release.apk` | Universal release APK, install directly on any device |

            ### Install

            ```
            adb install -r app-release.apk
            ```

            Or download the APK on the device and open it with
            "Install unknown apps" enabled.
