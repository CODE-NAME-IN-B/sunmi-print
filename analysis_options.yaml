include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Published sources carrying local patches, kept in step by
    # tool/verify_vendor_patches.sh. Linting them would only report their
    # upstream style, which this project does not own, and would make it
    # ambiguous whether an issue is ours or theirs.
    - third_party/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: false
    prefer_single_quotes: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
    avoid_unnecessary_containers: true
    prefer_const_literals_to_create_immutables: true
