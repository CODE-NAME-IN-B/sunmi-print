name: sunmi_print_app
description: Professional RawBT alternative for Sunmi thermal printers.
publish_to: 'none'
version: 1.1.0+15

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sunmi_printer_plus: ^4.1.1
  pdf_render: ^1.4.12
  image: ^4.5.2
  file_picker: ^8.1.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.3
  url_launcher: ^6.3.1
  http: ^1.6.0
  flutter_bluetooth_serial: ^0.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app_icon.png
    - assets/logo.png
